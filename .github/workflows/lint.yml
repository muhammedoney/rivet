name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verilator-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint core
        run: bash scripts/lint.sh
